spring:
  datasource:
    url: jdbc:h2:mem:coresto_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/coresto
          jwk-set-uri: http://localhost:8081/realms/coresto/protocol/openid-connect/certs

keycloak:
  admin:
    server-url: http://localhost:8081
    realm: master
    client-id: coresto-admin-service
    client-secret: test-client-secret
    target-realm: coresto
